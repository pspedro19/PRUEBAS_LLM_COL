# ========================================
# TEMPLATES DE LEARNING PATHS - MATEMÁTICAS
# ========================================

# TEMPLATE 1: PLAN BÁSICO - Para estudiantes con fundamentos débiles
basic_mathematics_path:
  metadata:
    name: "Plan Básico de Matemáticas ICFES"
    description: "Fortalece los fundamentos matemáticos desde cero"
    difficulty: "BASICO"
    estimated_hours: 40
    weekly_hours: 6
    color_theme: "#4F46E5"  # Indigo
    icon: "🧮"
    target_score_range: [0, 45]
    
  criteria:
    weak_areas_threshold: 0.4  # 40% o menos de acierto
    focus_topics: ["aritmetica", "algebra_basica", "geometria_plana"]
    learning_style: "guided"
    practice_intensity: "high"
    
  units:
    - id: 1
      title: "Fundamentos Aritméticos"
      description: "Operaciones básicas y propiedades numéricas"
      icon: "🔢"
      unit_type: "FOUNDATION"
      difficulty_modifier: 0.8
      estimated_duration: 300  # minutos
      xp_reward: 150
      topics:
        - "Operaciones con números enteros"
        - "Fracciones y decimales"
        - "Porcentajes y proporciones"
        - "Problemas de aplicación"
      lessons:
        - title: "Números enteros y operaciones"
          type: "VIDEO"
          duration: 25
          content_url: "/content/aritmetica/enteros"
        - title: "Práctica: Operaciones básicas"
          type: "PRACTICE"
          duration: 35
          questions_count: 15
        - title: "Fracciones paso a paso"
          type: "INTERACTIVE"
          duration: 30
          
    - id: 2
      title: "Álgebra Elemental"
      description: "Introducción a variables y ecuaciones simples"
      icon: "📐"
      unit_type: "CORE"
      difficulty_modifier: 0.8
      estimated_duration: 360
      xp_reward: 180
      topics:
        - "Variables y expresiones algebraicas"
        - "Ecuaciones lineales simples"
        - "Factorización básica"
        - "Sistemas de ecuaciones 2x2"
      lessons:
        - title: "¿Qué es una variable?"
          type: "VIDEO"
          duration: 20
        - title: "Resolviendo ecuaciones simples"
          type: "GUIDED_PRACTICE"
          duration: 40
        - title: "Evaluación: Álgebra básica"
          type: "ASSESSMENT"
          duration: 25
          
    - id: 3
      title: "Geometría Plana Básica"
      description: "Figuras, perímetros y áreas fundamentales"
      icon: "📏"
      unit_type: "CORE"
      difficulty_modifier: 0.8
      estimated_duration: 280
      xp_reward: 140
      topics:
        - "Figuras geométricas básicas"
        - "Perímetros y áreas"
        - "Teorema de Pitágoras"
        - "Semejanza y congruencia"
        
    - id: 4
      title: "Razones y Proporciones"
      description: "Aplicaciones prácticas de proporcionalidad"
      icon: "⚖️"
      unit_type: "PRACTICE"
      difficulty_modifier: 0.8
      estimated_duration: 240
      xp_reward: 120
      
    - id: 5
      title: "Estadística Descriptiva"
      description: "Medidas de tendencia central"
      icon: "📊"
      unit_type: "CORE"
      difficulty_modifier: 0.8
      estimated_duration: 260
      xp_reward: 130
      
    - id: 6
      title: "Probabilidad Básica"
      description: "Conceptos fundamentales de probabilidad"
      icon: "🎲"
      unit_type: "CORE"
      difficulty_modifier: 0.8
      estimated_duration: 220
      xp_reward: 110
      
    - id: 7
      title: "Funciones Lineales"
      description: "Introducción a funciones y gráficas"
      icon: "📈"
      unit_type: "CORE"
      difficulty_modifier: 0.9
      estimated_duration: 300
      xp_reward: 150
      
    - id: 8
      title: "Repaso Integral y Simulacro"
      description: "Consolidación y práctica tipo ICFES"
      icon: "🎯"
      unit_type: "ASSESSMENT"
      difficulty_modifier: 0.9
      estimated_duration: 180
      xp_reward: 200

