# ========================================
# CONFIGURACIÓN DE ASIGNACIÓN AUTOMÁTICA
# ========================================

assignment_rules:
  score_based:
    - range: [0, 45]
      template: "basic_mathematics_path"
      message: "Fortalecemos tus fundamentos matemáticos paso a paso"
      
    - range: [46, 70] 
      template: "intermediate_mathematics_path"
      message: "Perfeccionamos tus habilidades matemáticas existentes"
      
    - range: [71, 100]
      template: "advanced_mathematics_path" 
      message: "Llevamos tu dominio matemático al siguiente nivel"
      
  weak_areas_based:
    aritmetica: "basic_mathematics_path"
    algebra_basica: "basic_mathematics_path"
    algebra_avanzada: "intermediate_mathematics_path"
    geometria_plana: "basic_mathematics_path"
    geometria_analitica: "intermediate_mathematics_path"
    trigonometria: "intermediate_mathematics_path"
    calculo: "advanced_mathematics_path"
    estadistica_basica: "basic_mathematics_path"
    estadistica_avanzada: "intermediate_mathematics_path"
    probabilidad: "intermediate_mathematics_path"

# ========================================
# CONFIGURACIÓN DE UI/FRONTEND
# ========================================

ui_configuration:
  card_styles:
    basic:
      background: "gradient-to-br from-indigo-500 to-purple-600"
      text_color: "text-white"
      button_style: "bg-indigo-600 hover:bg-indigo-700"
      progress_color: "bg-indigo-400"
      
    intermediate:
      background: "gradient-to-br from-green-500 to-emerald-600"
      text_color: "text-white"
      button_style: "bg-green-600 hover:bg-green-700"
      progress_color: "bg-green-400"
      
    advanced:
      background: "gradient-to-br from-red-500 to-pink-600"
      text_color: "text-white"
      button_style: "bg-red-600 hover:bg-red-700"
      progress_color: "bg-red-400"
      
  progress_indicators:
    unit_progress:
      type: "circular"
      show_percentage: true
      animation: "smooth"
      
    overall_progress:
      type: "linear"
      show_steps: true
      milestone_rewards: true
      
  navigation:
    expandable_units: true
    breadcrumb_navigation: true
    quick_access_menu: true
    search_functionality: true 